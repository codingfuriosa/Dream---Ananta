<link rel="stylesheet" href="assets/css/ananta.css">
<style>
/* One screen, no scroll: the runway's vanishing point sits dead centre; the message waits above it. */
html,body{height:100%;overflow:hidden;background:#000}
.site-header{position:absolute;inset:0 0 auto;background:linear-gradient(180deg,#0c1020d9,#0c102000)}
.ty{position:relative;isolation:isolate;height:100svh;background:#000 url('assets/images/curated/horizon.webp') no-repeat;color:var(--on-dark);text-align:center}
.ty::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0c1020e6 0%,#0c1020b3 30%,#0c102066 44%,#0c102000 52%)}
.ty-card{position:absolute;left:50%;bottom:calc(50% + 40px);width:min(640px,calc(100% - 40px));transform:translateX(-50%)}
.ty .eyebrow{justify-content:center;color:var(--champagne)}
.ty .eyebrow::before,.ty .eyebrow::after{content:'';width:32px;height:1px;background:linear-gradient(90deg,var(--rose),var(--amber))}
.ty h1{color:var(--white)}
/* Solid champagne with a night halo, so it never melts into the horizon glow behind it. */
.ty h1{text-shadow:0 2px 24px #0c1020}
.ty h1 em{font-style:italic;font-weight:400;color:var(--champagne);text-shadow:0 0 28px #0c1020,0 2px 8px #0c1020cc}
.ty .horizon-rule{margin:28px auto 0}
/* Outlined in white: it reads as a quiet way home rather than another call to action. */
/* It sits low over the runway, apart from the message, with a light blur so the beam never washes it out. */
.ty .btn{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);min-width:240px;background:#0c102033;border-color:#ffffffb3;color:var(--white);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ty .btn:hover{background:#ffffff14;border-color:var(--white);color:var(--white)}
.site-header .ty-call{display:inline-flex;margin-left:auto}
@media (max-width:700px){.site-header .ty-call{padding:10px 14px;font-size:11px;letter-spacing:.06em}}
/* Wide screens: one line, sized to the window height so it always clears the logo above. */
@media (min-width:701px){.ty-card{width:min(1000px,calc(100% - 80px))}.ty h1{font-size:clamp(38px,min(5vw,8.5vh),76px)}.ty h1 br{display:none}}
@media (max-width:700px){.ty-card{bottom:calc(50% + 28px)}.ty .btn{width:calc(100% - 40px);bottom:calc(40px + env(safe-area-inset-bottom))}.ty .horizon-rule{margin-top:22px}}
@media (max-width:700px) and (max-height:720px){.ty h1{font-size:40px}.ty .horizon-rule{display:none}}
@media (max-height:620px){.ty .eyebrow{margin-bottom:14px}.ty .horizon-rule{display:none}.ty .btn{bottom:28px}}
</style>
</head>
<body>
<header class="site-header">
 <div class="header-inner">
  <a class="brand" href="index.html" aria-label="Ananta at Dream Gurukul, home"><img src="assets/images/web/ananta-logo.webp" width="1189" height="333" alt="Ananta at Dream Gurukul"></a>
  <a class="header-visit ty-call" href="tel:+917353158222" aria-label="Call +91 73531 58222" data-tel-mobile="+917353150777" data-tel-mobile-label="+91 73531 50777"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>+91 73531 58222</span></a>
 </div>
</header>
<main class="ty" data-horizon data-horizon-y="0.5">
 <div class="ty-card">
  <p class="eyebrow" id="ty-label">Enquiry received</p>
  <h1 id="ty-title">Thank you for <br>your <em>interest.</em></h1>
  <div class="horizon-rule"></div>
 </div>
 <a class="btn" id="ty-action" href="index.html">Back to Ananta ↗</a>
</main>
<script src="assets/js/lead-config.js"></script>
<script>
(function(){
 'use strict';
 // Phones call the mobile landing page's number; larger screens keep the desktop one.
 if(matchMedia('(max-width:700px)').matches)document.querySelectorAll('[data-tel-mobile]').forEach(function(a){a.href='tel:'+a.dataset.telMobile;a.setAttribute('aria-label','Call '+a.dataset.telMobileLabel);var label=a.querySelector('span')||a;if(label!==a)label.textContent=a.dataset.telMobileLabel;else a.lastChild.textContent=a.dataset.telMobileLabel;});
 var config=window.ANANTA_LEADS||{},accessKey='ananta_access';
 var $=function(id){return document.getElementById(id);};
 // Pin the runway's vanishing point (1439, 615 in the 2200×1114 artwork) to the centre of the screen.
 var stage=document.querySelector('.ty');
 function align(){var w=stage.clientWidth,h=stage.clientHeight,s=Math.max(w/(2*(2200-1439)),(h/2)/615,(h/2)/(1114-615));stage.style.backgroundSize=(2200*s)+'px '+(1114*s)+'px';stage.style.backgroundPosition=(w/2-1439*s)+'px '+(h/2-615*s)+'px';}
 addEventListener('resize',align);align();
 var intent=new URLSearchParams(location.search).get('intent');
 var receipt=null;try{receipt=JSON.parse(sessionStorage.getItem('ananta_enquiry_receipt')||'null');}catch(e){}
 function unlocked(){try{if(localStorage.getItem(accessKey)==='confirmed')return true;}catch(e){}return document.cookie.split('; ').indexOf(accessKey+'=confirmed')>-1;}
 var action=$('ty-action');
 if(!receipt&&!unlocked()){
  // Reached without an enquiry: invite one instead of thanking.
  $('ty-label').textContent='Dream Ananta';
  $('ty-title').innerHTML='Let’s start a <br><em>conversation.</em>';
  action.textContent='Enquire now ↗';
  action.href='index.html#enquiry';
  return;
 }
 // After a brochure enquiry, the download starts once the visitor is back on the main page.
 if((intent||(receipt&&receipt.intent))==='brochure')action.href='index.html?brochure=download';
 if(receipt){window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'thank_you_view',form:receipt.intent});}
})();
</script>
</body>
